[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quotenfabrik"
version = "0.1.0"
description = "Quotenfabrik Analyser – backend (ingest, database, analytics, API)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.13",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
qf = "quotenfabrik.cli:app"

[tool.setuptools.packages.find]
include = ["quotenfabrik*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument", "fastapi.Query"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
# tabular pattern definitions with German labels
"quotenfabrik/analytics/patterns.py" = ["E501"]
# German report texts
"quotenfabrik/analytics/service.py" = ["E501"]
# SQL strings and compact response dicts
"quotenfabrik/api/routers/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a PostgreSQL database (QF_TEST_DATABASE_URL)"]
