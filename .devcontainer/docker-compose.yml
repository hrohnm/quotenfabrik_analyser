# Dev container for GitHub Codespaces / VS Code: app container (Python + Node) and PostgreSQL 16.
# The database is filled from seed/quotenfabrik_seed.dump on its first start.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached
    environment:
      DATABASE_URL: postgresql+psycopg://qf:qf@db:5432/quotenfabrik
      API_URL: http://127.0.0.1:8000
    depends_on:
      - db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: qf
      POSTGRES_PASSWORD: qf
      POSTGRES_DB: quotenfabrik
    volumes:
      - qf_pgdata:/var/lib/postgresql/data
      - ../seed:/seed:ro
      - ../scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qf -d quotenfabrik"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  qf_pgdata:
