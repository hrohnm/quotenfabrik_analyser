# nginx: öffentlicher Zugang zum privaten Frontend, geschützt per Passwort (HTTP Basic Auth).
# Die App hat kein eigenes Login – ohne Passwort könnte jeder Ligen hinzufügen und API-Quota verbrauchen.
# Installieren: /etc/nginx/sites-available/quotenfabrik, server_name anpassen, danach certbot --nginx (HTTPS).
server {
    listen 80;
    listen [::]:80;
    server_name quotenfabrik.example.de;

    auth_basic "Quotenfabrik";
    auth_basic_user_file /etc/nginx/quotenfabrik.htpasswd;

    # Let's-Encrypt-Prüfung ohne Passwort
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # Backup-Download, langsame Auswertungen
    }
}
