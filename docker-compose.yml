services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: qf
      # set POSTGRES_PASSWORD in .env on a server (only applied when the volume is initialised)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qf}
      POSTGRES_DB: quotenfabrik
    ports:
      # localhost only: Docker bypasses ufw, a public port would expose the database
      - "127.0.0.1:5432:5432"
    volumes:
      - qf_pgdata:/var/lib/postgresql/data
      # first start with an empty volume: restore seed/quotenfabrik_seed.dump automatically
      - ./seed:/seed:ro
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qf -d quotenfabrik"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qf_pgdata:
